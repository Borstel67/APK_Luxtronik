<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Wärmepumpe</title>
<style>
/* Design wie ESP32_AquaControl (data/WifiManager.css) */
:root{
  --bg:#0b1220; --card:#121a2b; --ring:#1b2a4a; --muted:#9fb0cf; --text:#e6efff;
  --accent:#4cc9f0; --accent2:#4361ee; --ok:#2ec27e; --bad:#ff6b6b; --mid:#f4a261; --weak:#ffd166; --r:14px;
  --tile:#0f1730; --tring:#1c2c50; --input:#0e162b; --btn:#0f1830; --btnring:#24406c;
  /* Aliase für bestehende Klassen */
  --surface:var(--card); --surface2:var(--tile); --line:var(--ring); --brand:var(--accent); --err:var(--bad);
  --hot:var(--mid); --cold:var(--accent); --shadow:none;
  --head:#d9e6ff; --btntext:#e7f0ff; --label:#cbd6ef; --sel:#0f1c3a; --selring:#3760b9;
  --hdr1:rgba(18,26,43,1); --hdr2:rgba(18,26,43,.85); --fade:rgba(11,18,32,0); --fade2:rgba(11,18,32,.85);
  --hero1:#16224a; --hero2:#0f1c3a; --heroring:#2d5aa8; --scrim:rgba(3,7,15,.6); --inring:#1e2b4a; --infocus:#385a9b;
  --bannerbg:#1a0f14; --bannerring:#402029; --bannertext:#ffd6d6; --pilltext:#cfe2ff;
}
/* Hell: AquaControl „STA Light Theme“ (card-light / input-light / btn-light) */
:root[data-theme="light"]{
  --bg:#f3f6fb; --card:#ffffff; --ring:#e5e7eb; --muted:#4b5563; --text:#111827;
  --accent:#2563eb; --accent2:#4361ee; --ok:#16a34a; --bad:#dc2626; --mid:#d97706; --weak:#ca8a04;
  --tile:#f8fafc; --tring:#e2e8f0; --input:#ffffff; --btn:#ffffff; --btnring:#d1d5db;
  --head:#111827; --btntext:#111827; --label:#374151; --sel:#eff6ff; --selring:#2563eb;
  --hdr1:rgba(255,255,255,1); --hdr2:rgba(255,255,255,.9); --fade:rgba(243,246,251,0); --fade2:rgba(243,246,251,.85);
  --hero1:#eef4ff; --hero2:#ffffff; --heroring:#c7d7fe; --scrim:rgba(17,24,39,.35); --inring:#d1d5db; --infocus:#2563eb;
  --bannerbg:#fef2f2; --bannerring:#fecaca; --bannertext:#991b1b; --pilltext:#1e3a8a;
}
:root[data-theme="light"] .card,:root[data-theme="light"] .hdr{box-shadow:0 2px 12px rgba(0,0,0,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;padding-bottom:76px}
button{font:inherit;color:inherit}
/* Header-Karte */
header{position:sticky;top:0;z-index:5;padding:12px 12px 0;max-width:760px;margin:0 auto;background:linear-gradient(180deg,var(--bg) 70%,var(--fade))}
.hdr{background:linear-gradient(180deg,var(--hdr1),var(--hdr2));border:1px solid var(--ring);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;backdrop-filter:blur(6px)}
.title{display:flex;align-items:center;gap:10px;min-width:0}
.title h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:28px;height:28px;flex:none;border-radius:8px;background:linear-gradient(135deg,var(--accent2),var(--accent));position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.logo svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.logo::after{content:"";position:absolute;inset:-2px;border-radius:inherit;box-shadow:0 0 0 0 rgba(76,201,240,.35);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,201,240,.35)}70%{box-shadow:0 0 0 12px rgba(76,201,240,0)}100%{box-shadow:0 0 0 0 rgba(76,201,240,0)}}
.hint{font-size:12px;color:var(--muted);margin:0;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hactions{display:flex;align-items:center;gap:10px}
.gear{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--ring);background:var(--btn);color:var(--btntext);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.gear:active{border-color:var(--infocus)}
.gear svg{width:18px;height:18px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--weak)}.dot.err{background:var(--bad)}
html,body{overflow-x:hidden}
body{touch-action:pan-y}
main{padding:12px;max-width:760px;margin:0 auto}
main.swiping{transition:none}
main.snap{transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s}
/* Karten, Kacheln */
.card{background:var(--card);border:1px solid var(--ring);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.card .sec{padding:10px 12px 6px;font-size:13px;color:var(--accent);font-weight:600;background:transparent;border-bottom:1px solid var(--ring)}
h2{font-size:15px;color:var(--head);margin:18px 2px 8px;font-weight:600}
.banner{background:var(--bannerbg);border:1px solid var(--bannerring);padding:12px;border-radius:12px;margin-bottom:12px;color:var(--bannertext)}
.banner b{display:block;margin-bottom:2px;color:var(--bannertext)}
.banner .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));border:1px solid var(--heroring);border-radius:var(--r);padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.hero .big{font-size:42px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.hero .lbl{color:var(--muted);font-size:12px}
.hero .state{margin-left:auto;text-align:right;font-size:13px;max-width:55%}
.hero .state b{display:block;font-size:16px;color:var(--accent)}
.ochips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-top:8px}
.ochip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border:1px solid var(--tring);border-radius:999px;background:var(--tile);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ochip.on{border-color:var(--ok);color:var(--text)}
.odot{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.5}
.ochip.on .odot{background:var(--ok);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--tile);border:1px solid var(--tring);border-radius:12px;padding:10px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--muted);font-weight:400;margin-left:2px}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.tile.hot .v{color:var(--mid)}.tile.cold .v{color:var(--accent)}
.spark{display:block;width:100%;height:34px;margin-top:6px}
.spark path{fill:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.tile.hot .spark path{stroke:var(--mid)}
/* Zeilen */
.li{display:flex;align-items:center;gap:12px;padding:12px;border-top:1px solid var(--ring);min-height:48px}
.card>.li:first-child,.card>.sec+.li{border-top:0}
.li .k{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--head)}
.li .v{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;max-width:55%;overflow-wrap:anywhere}
.li.edit,.li.nav{cursor:pointer}
.li.edit .v{color:var(--accent);font-weight:600}
.li.edit:active,.li.nav:active{background:var(--sel)}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;border:1px dashed var(--ring);font-size:12px;color:var(--pilltext);background:transparent}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:0 2px 10px;color:var(--muted);font-size:13px}
.crumbs a{color:var(--accent);text-decoration:none;cursor:pointer}
.pagenav{display:flex;gap:8px;margin:0 0 12px}
.pagenav .btn{flex:1;text-align:center;padding:8px 12px;font-size:14px}
.muted{color:var(--muted)}
.center{text-align:center;padding:28px 10px}
.spinner{width:26px;height:26px;border:3px solid var(--ring);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Tabs unten */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:linear-gradient(180deg,var(--hdr2),var(--hdr1));border-top:1px solid var(--ring);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(6px)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
/* Buttons & Eingaben */
.btn{appearance:none;border:1px solid transparent;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));text-decoration:none;transition:border-color .15s,box-shadow .15s}
.btn:active{box-shadow:0 0 0 2px rgba(67,97,238,.18) inset}
.btn.sec{background:var(--btn);border-color:var(--btnring);color:var(--btntext);font-weight:500}
.btn:disabled{opacity:.6}
label.f{display:block;margin:12px 0 4px;font-size:14px;color:var(--label)}
input.f,select.f{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--inring);background:var(--input);color:var(--text);font:inherit;font-size:16px;outline:none}
input.f:focus,select.f:focus{border-color:var(--infocus)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:14px;color:var(--label)}
.switch input{width:22px;height:22px;accent-color:var(--accent2)}
/* Bottom-Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--card);border:1px solid var(--ring);border-bottom:0;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .card{background:var(--tile)!important;border-color:var(--tring)!important}
.opt{display:flex;align-items:center;gap:12px;padding:12px;margin-top:8px;border:1px solid var(--tring);border-radius:12px;background:var(--tile);cursor:pointer}
.opt:has(input:checked){outline:2px solid var(--selring);background:var(--sel)}
.opt input{width:20px;height:20px;accent-color:var(--accent2)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0 8px}
.stepper button{width:52px;height:52px;border-radius:12px;border:1px solid var(--btnring);background:var(--btn);color:var(--btntext);font-size:26px;cursor:pointer}
.stepper .val{font-size:32px;font-weight:600;min-width:130px;text-align:center;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--card);border:1px solid var(--heroring);color:var(--text);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
body.hasbar .toast{bottom:150px}
.upd{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.copyright{text-align:center;font-size:11px;color:var(--muted);margin:16px 8px 8px}
.sendbar{position:fixed;left:0;right:0;bottom:62px;z-index:7;display:flex;gap:8px;align-items:center;padding:10px 12px;background:linear-gradient(180deg,var(--fade2),var(--bg) 40%);border-top:1px solid var(--ring)}
.sendbar span{flex:1;font-size:13.5px;color:var(--muted)}
.sendbar.on span{color:var(--mid);font-weight:600}
body.hasbar main{padding-bottom:84px}
.tlink{color:var(--accent);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;padding:4px 2px}
.tlink.chg{color:var(--mid)}
.li .v small{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.logo::after{animation:none!important}}
</style>

<script>
'use strict';
/* ---------- persistent settings (Android bridge, localStorage fallback for browser testing) ---------- */
const APP_VERSION = '2.9';
const store = {
  get(k, d){ try{ if(window.Android) return Android.get(k, d); const v = localStorage.getItem('lux.'+k); return v==null?d:v; }catch(e){ return d; } },
  set(k, v){ try{ if(window.Android) Android.set(k, String(v)); else localStorage.setItem('lux.'+k, String(v)); }catch(e){} }
};
const cfg = {
  get host(){ return store.get('host', (location.hostname && location.protocol.startsWith('http')) ? location.hostname : '192.168.178.120'); },
  get port(){ return store.get('port', '8214'); },
  get pass(){ return store.get('pass', '999999'); },
  get code(){ return store.get('code', '9445'); },
  get interval(){ return Math.max(5, parseInt(store.get('interval', '15'), 10) || 15); },
  get allowEdit(){ return store.get('allowEdit', '1') === '1'; },
  get theme(){ return store.get('theme', 'auto'); },
  get java(){ return store.get('java', '1') === '1'; }
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>';
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2600); }
function setDot(state){ $('#dot').className = 'dot ' + state; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Luxtronik 2.x WebSocket client (port 8214, subprotocol "Lux_WS") ---------- */
class Lux {
  constructor(){ this.ws=null; this.queue=[]; this.pending=null; this.onstate=()=>{}; this.onpush=()=>{}; this.connected=false; }
  connect(host, port, pass){
    this.close();
    return new Promise((resolve, reject) => {
      let settled = false;
      const fail = (msg) => { if(!settled){ settled=true; reject(new Error(msg)); } };
      let ws;
      try { ws = new WebSocket('ws://' + host + ':' + port, 'Lux_WS'); }
      catch(e){ fail('Ungültige Adresse'); return; }
      this.ws = ws;
      const to = setTimeout(() => { fail('Zeitüberschreitung beim Verbinden'); try{ws.close();}catch(e){} }, 8000);
      ws.onopen = () => {
        this.connected = true;
        this.request('LOGIN;' + pass, 8000).then(xml => { clearTimeout(to); settled=true; resolve(xml); })
          .catch(e => { clearTimeout(to); fail(e.message); });
      };
      ws.onmessage = (e) => this._onMessage(e.data);
      ws.onerror = () => { clearTimeout(to); fail('Wärmepumpe nicht erreichbar'); };
      ws.onclose = () => {
        if (this.ws !== ws) return;
        this.connected = false; clearTimeout(to);
        this._failAll('Verbindung getrennt');
        fail('Verbindung abgelehnt');
        this.onstate('closed');
      };
    });
  }
  close(){ if(this.ws){ const w=this.ws; this.ws=null; try{ w.close(); }catch(e){} } this.connected=false; this._failAll('Verbindung geschlossen'); }
  _failAll(msg){ if(this.pending){ clearTimeout(this.pending.timer); this.pending.reject(new Error(msg)); this.pending=null; } this.queue.splice(0).forEach(j=>j.reject(new Error(msg))); }
  /** Send a command and wait for the next message from the controller. */
  request(cmd, timeout=8000, optional=false){ return new Promise((resolve, reject) => { this.queue.push({cmd, resolve, reject, timeout, optional, reply:true}); this._pump(); }); }
  /** Fire-and-forget (SET has no reply). */
  send(cmd){ return new Promise((resolve, reject) => { this.queue.push({cmd, resolve, reject, reply:false}); this._pump(); }); }
  _pump(){
    if (this.pending || !this.queue.length || !this.ws || this.ws.readyState !== 1) return;
    const job = this.queue.shift();
    try { this.ws.send(job.cmd); } catch(e){ job.reject(e); return this._pump(); }
    if (!job.reply){ job.resolve(); return this._pump(); }
    this.pending = job;
    job.timer = setTimeout(() => {
      if (this.pending !== job) return;
      this.pending = null;
      job.optional ? job.resolve(null) : job.reject(new Error('Keine Antwort'));
      this._pump();
    }, job.timeout);
  }
  _onMessage(data){
    const job = this.pending;
    if (!job) { this.onpush(String(data)); return; }
    clearTimeout(job.timer); this.pending = null;
    job.resolve(String(data)); this._pump();
  }
}

/* ---------- XML parsing ---------- */
function parseXml(text){
  if (!text) return null;
  const fixed = text.replace(/&(?!(amp|lt|gt|quot|apos|#\d+|#x[0-9a-f]+);)/gi, '&amp;');
  const doc = new DOMParser().parseFromString(fixed, 'text/xml');
  if (doc.getElementsByTagName('parsererror').length) return null;
  return doc.documentElement;
}
const childEls = (el, tag) => Array.from(el.children).filter(c => !tag || c.tagName === tag);
const childText = (el, tag) => { const c = childEls(el, tag)[0]; return c ? c.textContent.trim() : null; };

/** Navigation: tree of {id, name, children} */
function parseNav(root){
  const walk = el => childEls(el, 'item').map(it => ({ id: it.getAttribute('id'), name: childText(it, 'name') || '?', children: walk(it) }));
  return walk(root);
}
/** Content: tree of nodes; leaves carry value + editing meta. */
function parseContent(root){
  const walk = el => childEls(el, 'item').map(it => {
    const node = { id: it.getAttribute('id'), name: childText(it, 'name') || '', value: childText(it, 'value'), children: walk(it) };
    const opts = childEls(it, 'option').map(o => ({ value: o.getAttribute('value'), label: o.textContent.trim() }));
    if (opts.length) node.options = opts;
    ['min','max','step','div','raw','unit'].forEach(k => { const v = childText(it, k); if (v !== null) node[k] = v; });
    node.readOnly = (childText(it, 'readOnly') || '').toLowerCase() === 'true';
    node.editable = !node.readOnly && (!!node.options || (node.min != null && node.max != null && node.raw != null && isFinite(+node.raw)));
    return node;
  });
  return walk(root);
}
function flatLeaves(nodes, out=[]){ nodes.forEach(n => { if (n.children.length) flatLeaves(n.children, out); else out.push(n); }); return out; }
function findNav(nodes, re, path=[]){ for (const n of nodes){ const p=[...path,n]; if (re.test(n.name)) return p; const r = findNav(n.children, re, p); if (r) return r; } return null; }
const ACCESS_RE = /^(zugang|access)\b/i;
const INSTALLER_RE = /installateur|installer|fachmann|kundendienst|service/i;
function accessNode(nav){ return nav.find(n => ACCESS_RE.test(n.name)) || (findNav(nav, ACCESS_RE) || []).at(-1) || null; }
function accessLevel(nav){ const n = accessNode(nav); return n ? n.name.replace(/^[^:]*:\s*/, '') : null; }
function splitValue(v){ const m = String(v ?? '').match(/^\s*(-?\d+(?:[.,]\d+)?)\s*(.*)$/); return m ? {num:m[1], unit:m[2]} : {num:v ?? '–', unit:''}; }

const NAME_ALIAS = { verdichter1: 'verdichter' };
const norm = s => { const k = String(s || '').toLowerCase().replace(/ß/g, 'ss').replace(/[^a-z0-9äöü]/g, ''); return NAME_ALIAS[k] || k; };
function javaFormat(e, calc){
  const v = calc[e.id];
  if (v === undefined) return null;
  switch (e.t) {
    case 'num': { const f = e.f || 1; const val = f > 1 ? v / f : v;
      const txt = val.toFixed(e.d != null ? e.d : (f > 1 ? Math.round(Math.log10(f)) : 0));
      return (txt + ' ' + (e.u || '').trim()).trim(); }
    case 'onoff': return v === 0 ? 'Aus' : 'Ein';
    case 'time': { let x = Math.abs(v); const p = n => String(n).padStart(2, '0');
      return (v < 0 ? '-' : '') + p(Math.floor(x / 3600)) + ':' + p(Math.floor(x % 3600 / 60)) + ':' + p(x % 60); }
    case 'int': return String(v);
    case 'hex': return v.toString(16).toUpperCase();
    case 'ip': return [v >>> 24 & 255, v >>> 16 & 255, v >>> 8 & 255, v & 255].join('.');
    case 'sw': { let s = ''; for (let i = 0; i < 10; i++) { const c = calc[e.id + i]; if (!c) break; s += String.fromCharCode(c); } return s; }
    case 'avg': { const pulse = calc[e.p]; if (!(pulse > 0)) return null; const a = Math.floor(v / pulse);
      return Math.floor(a / 3600) + ':' + String(Math.floor(a % 3600 / 60)).padStart(2, '0') + ' h'; }
  }
  return String(v);
}
function javaVisible(e, data){
  const vis = data.visi || [];
  const ok = i => i < 0 || (vis.length ? vis[i] === 1 : false); // ohne 3005 nur immer sichtbare Werte
  if (!ok(e.v)) return false;
  if (e.t === 'avg' && !ok(e.pv)) return false;
  return true;
}
/** Werte einer Gruppe, die auf der WebSocket-Seite fehlen. */
function javaMissing(groupName, wsLeaves, data){
  const g = JAVA_INFO.find(x => norm(x.g) === norm(groupName));
  if (!g || !data || !data.calc) return [];
  const have = new Set((wsLeaves || []).map(l => norm(l.name)));
  const seen = new Set(), out = [];
  g.items.forEach(e => {
    const k = norm(e.n);
    if (have.has(k) || seen.has(k) || !javaVisible(e, data)) return;
    const val = javaFormat(e, data.calc);
    if (val == null) return;
    seen.add(k); out.push({ name: e.n, value: val, java: true, children: [] });
  });
  return out;
}

/* ---------- App ---------- */
const app = {
  mode: 'ws', lux: new Lux(), nav: [], tab: 'dash', java: null, javaAt: 0, javaWait: null, pageExtra: [], path: [], page: null, dash: {}, timer: null, busy: false, error: null, lastUpdate: null, paused: false,

  async init(){
    this.applyTheme();
    this.buildTabs();
    this.initSwipe();
    $('#btnRefresh').onclick = () => this.refresh(true);
    $('#scrim').onclick = (e) => { if (e.target.id === 'scrim') this.closeSheet(); };
    this.lux.onstate = () => { setDot('err'); };
    this.lux.onpush = (txt) => { const r = parseXml(txt); if (r && r.tagName === 'Navigation') { const nav = parseNav(r); if (nav.length) { this.nav = nav; this.path = []; this.page = null; if (this.tab !== 'settings') this.render(); } } };
    this.render();
    await this.connect();
  },

    };
    const tabs = this.mode === 'java'
      ? [['dash', 'Übersicht'], ['heiz', 'Heizung'], ['ww', 'Warmwasser'], ['service', 'Service'], ['settings', 'App']]
      : [['dash', 'Übersicht'], ['menu', 'Menü'], ['settings', 'Einstellungen']];
    this.tabOrder = tabs.map(t => t[0]);
    if (!tabs.some(t => t[0] === this.tab)) this.tab = 'dash';
    $('#tabs').innerHTML = tabs.map(([k, l]) => `<button data-tab="${k}" class="${k === this.tab ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>${l}</button>`).join('');
    document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => this.show(b.dataset.tab));
  },

  applyTheme(){
    const t = cfg.theme;
    const night = t === 'dark' || (t === 'auto' && (window.Android ? Android.isNight() : matchMedia('(prefers-color-scheme: dark)').matches));
    document.documentElement.dataset.theme = night ? 'dark' : 'light';
    try { window.Android && Android.setBarColor(night ? '#0b1220' : '#f3f6fb'); } catch(e){}
  },

  async connect(){
    this.error = null; setDot('busy');
    if (this.tab !== 'settings') this.render();
    if (cfg.java && JB.available()) {
      const d = await jui.read();
      if (d) {
        this.lux.close(); this.mode = 'java'; this.buildTabs(); setDot('ok');
        this.lastUpdate = new Date(); this.render(); this.schedule(); return;
      }
    }
    if (this.mode === 'java') { this.mode = 'ws'; jui.sub = null; this.buildTabs(); }
    try {
      const xml = await this.lux.connect(cfg.host, cfg.port, cfg.pass);
      const root = parseXml(xml);
      if (!root || root.tagName !== 'Navigation') throw new Error('Unerwartete Antwort – Passwort falsch?');
      this.nav = parseNav(root);
      setDot('ok');
      if (cfg.code && !INSTALLER_RE.test(accessLevel(this.nav) || '')) await this.elevate(cfg.code, false);
      await this.refresh();
      this.schedule();
    } catch(e){
      this.error = e.message; setDot('err');
      this.render();
      this.schedule(true);
    }
  },

  schedule(retry){
    clearTimeout(this.timer);
    if (this.paused) return;
    this.timer = setTimeout(async () => {
      if (this.mode !== 'java' && !this.lux.connected) return this.connect();
      await this.refresh(); this.schedule();
    }, (retry ? 10 : cfg.interval) * 1000);
  },
  pause(){ this.paused = true; clearTimeout(this.timer); this.lux.close(); },
  resume(){ this.applyTheme(); if (!this.paused) return; this.paused = false; this.connect(); },

  /** Switch access level by writing the code into the "Zugang" page (like the web UI). */
  async elevate(code, manual){
    const acc = accessNode(this.nav);
    if (!acc) { if (manual) toast('Kein Menüpunkt „Zugang“ gefunden'); return false; }
    try {
      const content = await this.getPage(acc.id);
      const leaves = flatLeaves(content);
      // Nur in ein eindeutiges Code-/Passwortfeld schreiben – niemals in andere Parameter
      // (Parameter 107 "Einst_Zugangscode" ist z.B. ein Kurzprogramm-Wert, kein Login).
      const target = leaves.find(l => /code|passw|kennw/i.test(l.name) && !l.options && !l.readOnly && (l.max == null || +code <= +l.max));
      if (!target) {
        toast('Zugang-Seite enthält kein Codefeld – nichts geändert');
        this.accessXml = JSON.stringify(content);
        return false;
      }
      const setId = target.id;
      await this.lux.send('SET;set_' + setId + ';' + code);
      let reply = await this.lux.request('SAVE;1', 4000, true);
      let root = parseXml(reply);
      if (!root || root.tagName !== 'Navigation') { reply = await this.lux.request('REFRESH', 4000, true); root = parseXml(reply); }
      if (root && root.tagName === 'Navigation') { const nav = parseNav(root); if (nav.length) this.nav = nav; }
      const ok = INSTALLER_RE.test(accessLevel(this.nav) || '');
      if (manual || !ok) toast(ok ? 'Zugang: ' + accessLevel(this.nav) : 'Installateur-Code wurde nicht angenommen');
      this.path = []; this.page = null; this.dash = this.dash || {};
      return ok;
    } catch(e){ if (manual) toast('Zugang fehlgeschlagen: ' + e.message); return false; }
  },
  accessDialog(){
    const sh = $('#sheet');
    sh.innerHTML = `<h3>Zugangsebene</h3><div class="muted" style="font-size:13px">Aktuell: ${esc(accessLevel(this.nav) || 'unbekannt')}</div>
      <label class="f" for="acCode">Code</label><input class="f" id="acCode" type="password" inputmode="numeric" value="${esc(cfg.code)}">
      <div class="actions"><button class="btn sec" id="bc">Abbrechen</button><button class="btn" id="bo">Anmelden</button></div>`;
    $('#scrim').classList.add('open');
    $('#bc').onclick = () => this.closeSheet();
    $('#bo').onclick = async () => { $('#bo').disabled = true; $('#bo').textContent = 'Prüfe…'; await this.elevate($('#acCode').value.trim(), true); this.closeSheet(); this.show('menu'); };
  },

  /** Rohwerte über die Java-Schnittstelle holen (max. alle 10 s). */
  javaLoad(){
    if (!cfg.java) return Promise.resolve(null);
    if (this.java && Date.now() - this.javaAt < 10000) return Promise.resolve(this.java);
    const src = window.Android && Android.javaData ? 'android' : (window.__javaMock ? 'mock' : null);
    if (!src) return Promise.resolve(null);
    if (this.javaWait) return this.javaWait.p;
    let resolve; const p = new Promise(r => resolve = r);
    this.javaWait = { p, resolve };
    setTimeout(() => this.onJava({ error: 'Zeitüberschreitung' }), 9000);
    if (src === 'android') Android.javaData(cfg.host); else setTimeout(() => this.onJava(window.__javaMock), 50);
    return p;
  },
  onJava(a, b){
    if (typeof a === 'number') return JB.done(a, b);
    const data = a;
    if (!this.javaWait) return;
    const w = this.javaWait; this.javaWait = null;
    if (data && data.calc) { this.java = data; this.javaAt = Date.now(); this.javaError = null; }
    else { this.javaError = data && data.error; }
    w.resolve(this.java);
  },
  /** Für Informationen-Seiten: fehlende Werte aus wp.jar ergänzen. */
  async loadExtra(node){
    this.pageExtra = [];
    const parent = this.path.length > 1 ? this.path.at(-2) : null;
    if (!node || !parent || !/^(informationen|information)$/i.test(parent.name)) return;
    const data = await this.javaLoad();
    if (data && this.path.at(-1) === node) this.pageExtra = javaMissing(node.name, flatLeaves(this.page || []), data);
  },

  async getPage(id){
    const xml = await this.lux.request('GET;' + id);
    const root = parseXml(xml);
    if (!root) throw new Error('Antwort nicht lesbar');
    return parseContent(root);
  },

  async refresh(manual){
    if (this.busy) return;
    if (this.mode === 'java') {
      this.busy = true; setDot('busy');
      const d = await jui.read();
      this.busy = false;
      if (d) { this.error = null; this.lastUpdate = new Date(); setDot('ok'); if (manual) toast('Aktualisiert'); }
      else { this.error = 'Java-Schnittstelle: ' + jui.err; setDot('err'); this.javaFails = (this.javaFails || 0) + 1; if (this.javaFails >= 3) { this.javaFails = 0; return this.connect(); } }
      if (this.tab !== 'settings' && !$('#scrim').classList.contains('open')) this.render();
      return;
    }
    if (!this.lux.connected){ if (manual) this.connect(); return; }
    this.busy = true; setDot('busy');
    try {
      if (this.tab === 'dash') await this.loadDash();
      else if (this.tab === 'menu' && this.path.length) {
        const node = this.path[this.path.length-1];
        if (!node.children.length) { this.page = await this.getPage(node.id); await this.loadExtra(node); }
      }
      this.lastUpdate = new Date(); this.error = null; setDot('ok');
      if (manual) toast('Aktualisiert');
    } catch(e){ this.error = e.message; setDot('err'); }
    this.busy = false;
    if (this.tab !== 'settings' && !$('#scrim').classList.contains('open')) this.render();
  },

  async loadDash(){
    const temps = findNav(this.nav, /^(temperaturen|temperatures)$/i);
    const status = findNav(this.nav, /^(anlagenstatus|system ?status|installation status)$/i);
    const mode = findNav(this.nav, /^(betriebsart|operating mode|mode)$/i);
    const d = {};
    if (temps) d.temps = flatLeaves(await this.getPage(temps.at(-1).id));
    if (status) d.status = flatLeaves(await this.getPage(status.at(-1).id));
    const jd = await this.javaLoad();
    if (jd) { d.extraTemps = javaMissing('Temperaturen', d.temps, jd); d.extraStatus = javaMissing('Anlagenstatus', d.status, jd); }
    if (mode && !mode.at(-1).children.length) { d.modeId = mode.at(-1).id; d.mode = flatLeaves(await this.getPage(d.modeId)); }
    const errs = findNav(this.nav, /^(fehlerspeicher|error memory)$/i);
    const offs = findNav(this.nav, /^(abschaltungen|switch offs|shutdowns)$/i);
    if (errs) d.errors = flatLeaves(await this.getPage(errs.at(-1).id));
    if (offs) d.offs = flatLeaves(await this.getPage(offs.at(-1).id));
    this.dash = d;
  },

  /* Tabwechsel durch horizontales Wischen (Übersicht ⇄ Heizung ⇄ Warmwasser ⇄ Service ⇄ App) */
  initSwipe(){
    const m = $('#main');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let x0 = 0, y0 = 0, t0 = 0, dx = 0, axis = null, active = false;
    const W = () => Math.max(window.innerWidth, 1);
    const set = (x, anim) => { m.classList.toggle('snap', !!anim); m.classList.toggle('swiping', !anim); m.style.transform = x ? `translateX(${x}px)` : ''; m.style.opacity = x ? String(Math.max(.35, 1 - Math.abs(x) / W() * .6)) : ''; };
    const neighbour = (dir) => { const o = this.tabOrder || [], i = o.indexOf(this.tab); return i < 0 ? null : o[i + dir] || null; };
    const blocked = (el) => $('#scrim').classList.contains('open') || (el && el.closest && (el === document.activeElement && el.matches('input,textarea')) || el.closest('header,nav.tabs,#scrim,input[type=range],textarea,.sendbar,.noswipe'));
    document.addEventListener('touchstart', e => {
      active = false; axis = null; dx = 0;
      if (e.touches.length !== 1 || blocked(e.target)) return;
      const t = e.touches[0];
      if (t.clientX < 16 || t.clientX > W() - 16) return;   // Systemgeste am Rand nicht stören
      x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); active = true;
    }, { passive: true });
    document.addEventListener('touchmove', e => {
      if (!active) return;
      const t = e.touches[0], ddx = t.clientX - x0, ddy = t.clientY - y0;
      if (!axis) {
        if (Math.abs(ddx) < 10 && Math.abs(ddy) < 10) return;
        axis = Math.abs(ddx) > Math.abs(ddy) * 1.2 ? 'x' : 'y';
        if (axis === 'y') { active = false; return; }
      }
      // ohne Nachbar-Tab nur gedämpft mitziehen
      dx = neighbour(ddx < 0 ? 1 : -1) ? ddx : ddx / 4;
      set(dx, false);
    }, { passive: true });
    const end = () => {
      if (!active || axis !== 'x') { active = false; return; }
      active = false;
      const v = Math.abs(dx) / Math.max(1, Date.now() - t0);
      const dir = dx < 0 ? 1 : -1, next = neighbour(dir);
      if (!next || (Math.abs(dx) < W() * 0.22 && v < 0.45)) { set(0, true); return; }
      const go = () => {
        if (!this.show(next)) { set(0, true); return; }
        if (reduce) { set(0, false); return; }
        set(dir * W() * 0.35, false);
        void m.offsetWidth;
        set(0, true);
      };
      if (reduce) go();
      else { set(-dir * W(), true); setTimeout(go, 180); }
    };
    document.addEventListener('touchend', end, { passive: true });
    document.addEventListener('touchcancel', () => { if (active) { active = false; set(0, true); } }, { passive: true });
  },

  show(tab){
    if (this.mode === 'java' && Object.keys(jui.pending).length && !window.confirm('Ungesendete Änderungen verwerfen?')) return false;
    jui.sub = null; jui.stack = []; jui.pending = {}; jui.clock = null;
    this.tab = tab;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    window.scrollTo(0, 0);
    window.scrollTo(0, 0);
    this.render();
    if (this.mode !== 'java' && tab === 'dash' && !this.dash.temps) this.refresh();
    return true;
  },

  back(){
    if ($('#scrim').classList.contains('open')) { this.closeSheet(); return true; }
    if (this.mode === 'java' && jui.back()) return true;
    if (this.tab === 'menu' && this.path.length){ this.path.pop(); this.page = null; this.openPath(); return true; }
    if (this.tab !== 'dash'){ this.show('dash'); return true; }
    return false;
  },

  /* ----- rendering ----- */
  footer(){ return `<footer class="copyright">© 2026 R.Wisser · v${APP_VERSION}</footer>`; },
  setSub(){
    const d = this.lastUpdate, p = n => String(n).padStart(2, '0');
    const t = d ? `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} · ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` : 'verbinde …';
    $('#subtxt').textContent = t + (d ? (this.mode === 'java' ? ' · Port 8888' : ' · WebSocket') : '');
  },
  render(){
    const m = $('#main');
    this.setSub();
    $('#title').textContent = this.tab === 'menu' && this.path.length ? this.path.at(-1).name : (this.tab === 'settings' ? 'Einstellungen' : 'Wärmepumpe');
    if (this.tab === 'settings') { document.body.classList.remove('hasbar'); m.innerHTML = this.viewSettings() + this.footer(); this.bindSettings(); return; }
    if (this.mode === 'java') {
      const err = this.error ? `<div class="banner"><b>Verbindungsproblem</b>${esc(this.error)}<div class="row"><button class="btn" onclick="app.connect()">Erneut verbinden</button></div></div>` : '';
      m.innerHTML = err + jui.view(this.tab) + this.footer();
      document.body.classList.toggle('hasbar', !!m.querySelector('.sendbar'));
      jui.bind(m);
      return;
    }
    document.body.classList.remove('hasbar');
    let h = '';
    if (this.error) h += `<div class="banner"><b>Keine Verbindung</b>${esc(this.error)}<div class="muted" style="font-size:13px;margin-top:4px">Ziel: ws://${esc(cfg.host)}:${esc(cfg.port)} – das Handy muss im selben WLAN sein.</div><div class="row"><button class="btn" onclick="app.connect()">Erneut verbinden</button><button class="btn sec" onclick="app.show('settings')">Einstellungen</button></div></div>`;
    if (this.tab === 'dash') h += this.viewDash();
    else h += this.viewMenu();
    m.innerHTML = h + this.footer();
    m.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => this.edit(el.dataset.edit, el.dataset.src));
    m.querySelectorAll('[data-nav]').forEach(el => el.onclick = () => this.navTo(+el.dataset.nav));
    m.querySelectorAll('[data-crumb]').forEach(el => el.onclick = () => { this.path = this.path.slice(0, +el.dataset.crumb); this.page=null; this.openPath(); });
  },

  loading(){ return '<div class="center"><div class="spinner"></div><span class="muted">Lade Daten…</span></div>'; },

  viewDash(){
    const d = this.dash;
    if (!d.temps && !d.status) return this.error ? '' : this.loading();
    const temps = d.temps || [];
    const pool = temps.concat(d.extraTemps || []);
    const take = (re) => { const i = pool.findIndex(t => re.test(t.name)); return i >= 0 ? pool.splice(i, 1)[0] : null; };
    const outside = take(/au(ß|ss)entemp|outside|ambient/i);
    const status = d.status || [];
    const st = status.find(s => /betriebszustand|operating state|status/i.test(s.name)) || status.find(s => /zustand|state/i.test(s.name));
    const keys = [
      [/^vorlauf$|^flow( temp)?$|^flow line$/i, 'hot'], [/^vorlauf.?soll|flow.*(target|set)/i, ''], [/^rücklauf$|^return( temp)?$/i, 'cold'], [/rückl.*soll|return.*(target|set)/i, ''],
      [/warmwasser.?ist|dhw.*(actual|ist)|hot water.*actual/i, 'hot'], [/warmwasser.?soll|dhw.*(target|set)|hot water.*target/i, ''],
      [/wärmequelle.?ein|heat source.*in/i, 'cold'], [/wärmequelle.?aus|heat source.*out/i, 'cold'], [/mischkreis.?1.?vorlauf|mixed circuit 1 flow/i, 'hot']
    ];
    let h = '';
    const ov = outside ? splitValue(outside.value) : null;
    h += `<div class="hero"><div><div class="lbl">${esc(outside ? outside.name : 'Außentemperatur')}</div><div class="big">${esc(ov ? ov.num : '–')}<span style="font-size:22px">${esc(ov ? ov.unit : '')}</span></div></div>
      <div class="state"><span class="lbl">${esc(st ? st.name : 'Status')}</span><b>${esc(st ? st.value : '–')}</b></div></div>`;
    let tiles = '';
    keys.forEach(([re, cls]) => { const t = take(re); if (t){ const v = splitValue(t.value); tiles += `<div class="tile ${cls}"><div class="k">${esc(t.name)}</div><div class="v">${esc(v.num)}<small>${esc(v.unit)}</small></div></div>`; } });
    if (tiles) h += `<div class="grid">${tiles}</div>`;

    if (d.mode && d.mode.length){
      h += `<h2>Betriebsart</h2><div class="card">`;
      d.mode.forEach((n, i) => { h += this.rowHtml(n, 'mode:' + i); });
      h += `</div>`;
    }
    if (status.length){
      h += `<h2>Anlagenstatus</h2><div class="card">`;
      status.concat(d.extraStatus || []).forEach(n => { if (n !== st) h += this.rowHtml(n); });
      h += `</div>`;
    }
    const evList = (title, list) => {
      if (!list || !list.length) return '';
      return `<h2>${title}</h2><div class="card">` + list.slice(0, 3).map(n =>
        `<div class="li"><span class="k">${esc(n.value)}</span><span class="v">${esc(n.name)}</span></div>`).join('') + `</div>`;
    };
    h += evList('Letzte Fehler', d.errors) + evList('Letzte Abschaltungen', d.offs);
    if (pool.length){
      h += `<h2>Weitere Temperaturen</h2><div class="card">`;
      pool.forEach(n => h += this.rowHtml(n));
      h += `</div>`;
    }
    if (this.lastUpdate) h += `<div class="upd">Stand ${this.lastUpdate.toLocaleTimeString('de-DE')} · alle ${cfg.interval} s</div>`;
    return h;
  },

  rowHtml(n, src){
    const can = n.editable && cfg.allowEdit && src;
    return `<div class="li${can ? ' edit' : ''}"${can ? ` data-edit="${esc(src)}"` : ''}><span class="k">${esc(n.name)}${n.java ? ' <span class="pill" title="aus wp.jar / Port 8888">J</span>' : ''}</span><span class="v">${esc(n.value ?? '')}</span>${can ? chev : ''}</div>`;
  },

  viewMenu(){
    if (!this.nav.length) return this.error ? '' : this.loading();
    let h = '';
    if (this.path.length){
      h += `<div class="crumbs"><a data-crumb="0">Menü</a>`;
      this.path.forEach((p, i) => { h += ' › ' + (i < this.path.length-1 ? `<a data-crumb="${i+1}">${esc(p.name)}</a>` : `<span>${esc(p.name)}</span>`); });
      h += `</div>`;
    }
    const node = this.path.at(-1);
    const list = node ? node.children : this.nav;
    if (!node && accessLevel(this.nav)) h += `<div class="crumbs"><span class="pill">Zugang: ${esc(accessLevel(this.nav))}</span></div>`;
    if (list.length){
      h += `<div class="card">` + list.map((c, i) => `<div class="li nav" data-nav="${i}"><span class="k">${esc(c.name)}</span>${chev}</div>`).join('') + `</div>`;
      return h;
    }
    if (!this.page) return h + this.loading();
    this.pageLeaves = [];
    const renderNodes = (nodes) => {
      let s = '', rows = '';
      const flush = () => { if (rows){ s += `<div class="card">${rows}</div>`; rows=''; } };
      nodes.forEach(n => {
        if (n.children.length){
          flush();
          const leaves = n.children.every(c => !c.children.length);
          if (leaves){
            s += `<div class="card"><div class="sec">${esc(n.name)}</div>`;
            n.children.forEach(c => { const idx = this.pageLeaves.push(c) - 1; s += this.rowHtml(c, 'page:' + idx); });
            s += `</div>`;
          } else { s += `<h2>${esc(n.name)}</h2>` + renderNodes(n.children); }
        } else { const idx = this.pageLeaves.push(n) - 1; rows += this.rowHtml(n, 'page:' + idx); }
      });
      flush();
      return s;
    };
    h += renderNodes(this.page);
    if (this.pageExtra && this.pageExtra.length)
      h += `<h2>Ergänzt aus wp.jar</h2><div class="card">` + this.pageExtra.map(n => `<div class="li"><span class="k">${esc(n.name)}</span><span class="v">${esc(n.value)}</span></div>`).join('') + `</div>`;
    if (!this.pageLeaves.length) h += '<div class="center muted">Keine Einträge</div>';
    if (this.lastUpdate) h += `<div class="upd">Stand ${this.lastUpdate.toLocaleTimeString('de-DE')}</div>`;
    return h;
  },

  navTo(i){
    const node = this.path.at(-1);
    const list = node ? node.children : this.nav;
    if (ACCESS_RE.test(list[i].name) && !list[i].children.length) { this.accessDialog(); return; }
    this.path.push(list[i]); this.page = null;
    window.scrollTo(0, 0);
    this.openPath();
  },
  async openPath(){
    this.render();
    const node = this.path.at(-1);
    if (node && !node.children.length) {
      try { setDot('busy'); this.page = await this.getPage(node.id); this.pageExtra = []; this.render(); await this.loadExtra(node); this.lastUpdate = new Date(); setDot('ok'); this.error = null; }
      catch(e){ this.error = e.message; setDot('err'); }
      if (this.path.at(-1) === node) this.render();
    }
  },

  /* ----- editing ----- */
  edit(src){
    const [kind, idx] = src.split(':');
    const n = kind === 'mode' ? this.dash.mode[+idx] : this.pageLeaves[+idx];
    if (!n || !n.editable) return;
    const pageId = kind === 'mode' ? this.dash.modeId : this.path.at(-1).id;
    const sh = $('#sheet');
    let h = `<h3>${esc(n.name)}</h3><div class="muted" style="font-size:13px">Aktuell: ${esc(n.value)}</div>`;
    let getRaw;
    if (n.options){
      h += `<div style="margin-top:12px">` + n.options.map(o => `<label class="opt"><input type="radio" name="o" value="${esc(o.value)}" ${String(o.value) === String(n.raw) || o.label === n.value ? 'checked' : ''}><span>${esc(o.label)}</span></label>`).join('') + `</div>`;
      getRaw = () => { const c = sh.querySelector('input[name=o]:checked'); return c ? c.value : null; };
    } else {
      const min = +n.min, max = +n.max, step = +(n.step || 1) || 1, div = +(n.div || 1) || 1;
      let raw = +n.raw;
      const dec = div > 1 ? Math.round(Math.log10(div)) : 0;
      const unit = (n.unit || splitValue(n.value).unit || '').trim();
      const fmt = r => (r / div).toFixed(dec).replace('.', ',') + ' ' + unit;
      h += `<div class="stepper"><button id="sm">−</button><div class="val" id="sv">${esc(fmt(raw))}</div><button id="sp">+</button></div><div class="muted center" style="padding:0;font-size:12.5px">Bereich ${esc(fmt(min))} … ${esc(fmt(max))}</div>`;
      setTimeout(() => {
        const upd = () => { $('#sv').textContent = fmt(raw); };
        $('#sm').onclick = () => { raw = Math.max(min, raw - step); upd(); };
        $('#sp').onclick = () => { raw = Math.min(max, raw + step); upd(); };
      });
      getRaw = () => String(raw);
    }
    h += `<div class="actions"><button class="btn sec" id="bc">Abbrechen</button><button class="btn" id="bo">Übernehmen</button></div>`;
    sh.innerHTML = h;
    $('#scrim').classList.add('open');
    $('#bc').onclick = () => this.closeSheet();
    $('#bo').onclick = async () => {
      const raw = getRaw();
      if (raw == null) return;
      if (String(raw) === String(n.raw)) { this.closeSheet(); return; }
      $('#bo').disabled = true; $('#bo').textContent = 'Speichere…';
      try {
        await this.lux.send('SET;set_' + n.id + ';' + raw);
        await this.lux.request('SAVE;1', 4000, true);
        this.closeSheet(); toast('Gespeichert');
        await sleep(400);
        if (kind === 'mode') await this.refresh(); else { this.page = await this.getPage(pageId); this.render(); }
      } catch(e){ this.closeSheet(); toast('Fehler: ' + e.message); }
    };
  },
  closeSheet(){ $('#scrim').classList.remove('open'); $('#sheet').innerHTML = ''; this.render(); },

  /* ----- settings ----- */
  viewSettings(){
    return `<div class="card" style="padding:4px 16px 16px">
      <label class="f" for="sHost">IP-Adresse der Wärmepumpe</label><input class="f" id="sHost" inputmode="decimal" value="${esc(cfg.host)}">
      <label class="f" for="sPort">WebSocket-Port</label><input class="f" id="sPort" inputmode="numeric" value="${esc(cfg.port)}">
      <label class="f" for="sPass">Passwort (Webserver)</label><input class="f" id="sPass" type="password" value="${esc(cfg.pass)}">
      <label class="f" for="sCode">Zugangscode Installateur (leer = Benutzer)</label><input class="f" id="sCode" type="password" inputmode="numeric" value="${esc(cfg.code)}">
      <label class="f" for="sInt">Aktualisierung (Sekunden)</label><input class="f" id="sInt" inputmode="numeric" value="${esc(cfg.interval)}">
      <label class="switch"><span>Java-Schnittstelle wie wp.jar (Port 8888) verwenden</span><input type="checkbox" id="sJava" ${cfg.java ? 'checked' : ''}></label>
      <label class="switch"><span>Werte ändern erlauben</span><input type="checkbox" id="sEdit" ${cfg.allowEdit ? 'checked' : ''}></label>
      <label class="f" for="sTheme">Darstellung</label>
      <select class="f" id="sTheme">
        <option value="auto" ${cfg.theme==='auto'?'selected':''}>System (hell/dunkel automatisch)</option><option value="light" ${cfg.theme==='light'?'selected':''}>Hell</option><option value="dark" ${cfg.theme==='dark'?'selected':''}>Dunkel</option>
      </select>
      <div class="actions"><button class="btn" id="sSave">Speichern &amp; verbinden</button></div>
    </div>
    <div class="muted" style="font-size:13px;padding:4px 6px;line-height:1.5">
      Aktive Datenquelle: <b>${app.mode === 'java' ? 'Java-Schnittstelle (Port 8888, wie wp.jar)' : 'WebSocket (Port 8214)'}</b>.<br>
      Primär nutzt die App die Java-Schnittstelle des Original-Applets (Lesen 3003/3004/3005, Schreiben 3002 – jeweils mit Bestätigung).
      Ist sie nicht erreichbar, verbindet sie sich über die Luxtronik-Weboberfläche per WebSocket (Port 8214, „Lux_WS“).
      Standard-Passwort des Webservers ist <b>999999</b>. Installateur-Code 9445 schaltet – wie im Applet – die Installateur-Einstellungen frei (WebSocket: Zugang wird an der Steuerung gesetzt). Änderungen werden wie im Original-Webinterface mit SET/SAVE übernommen.
    </div>`;
  },
  bindSettings(){
    $('#sSave').onclick = () => {
      const oldHost = cfg.host;
      const host = $('#sHost').value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
      store.set('host', host || '192.168.178.120');
      store.set('port', ($('#sPort').value.trim() || '8214'));
      store.set('pass', $('#sPass').value);
      store.set('code', $('#sCode').value.trim());
      store.set('interval', String(Math.max(5, parseInt($('#sInt').value, 10) || 15)));
      store.set('allowEdit', $('#sEdit').checked ? '1' : '0');
      store.set('java', $('#sJava').checked ? '1' : '0'); this.java = null;
      store.set('theme', $('#sTheme').value);
      this.applyTheme();
      if (window.Android && oldHost !== cfg.host) { Android.reload(); return; }
      this.dash = {}; this.nav = []; this.path = []; this.page = null;
      toast('Gespeichert');
      this.show('dash');
      this.connect();
    };
  }
};
window.app = app;
app.init();
</script>
